}

.product:hover {
  transform: translateY(-5px);

}
    .product .emoji { font-size: 48px; }
    .product h3 { margin-bottom: 7px; }
    .price { color: var(--pink-dark); font-weight: bold; font-size: 20px; }
    .product button { margin-top: 10px; }
    .feature {

    .panel {

    footer {

    #status { min-height: 24px; color: var(--pink-dark); }
    @media(max-width:600px) {
      header { justify-content: center; }

    .modal {
  position: fixed;

}

.modal-content {

  </style>

<body>

<header>

<section id="shop">
  <h2 class="section-title">Our Little Collection ♡</h2>
  <p class="subtitle">Find something special for every mood.</p>
  <p id="loading" class="subtitle">Loading our collection...</p>
  <div class="products" id="products"></div>
  <p id="product-error" class="subtitle"></p>
</section>









<footer>
  <h2>Cozy Craving ♡</h2>
  <p>Your mood. Your cravings. Your comfort.</p>
  <p>Made with love, just for you.</p>
</footer>

<script>
  // We'll add your Supabase Project URL and Publishable Key in the next step.
  const SUPABASE_URL = "https://hmpjqlimgkvgtohbhcde.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_axO2IpUc6tA1xSelOH2TQw_C15MZv4D";

  let supabaseClient = null;
  let products = [];
  let cart = JSON.parse(localStorage.getItem("cosyCravingCart") || "[]");

  if (window.supabase &&
      SUPABASE_URL.startsWith("https://") &&
      SUPABASE_PUBLISHABLE_KEY !== "YOUR_SUPABASE_PUBLISHABLE_KEY") {
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
  }

 async function loadProducts() {
  const container = document.getElementById("products");
  document.getElementById("loading").textContent = "";

  if (!supabaseClient) {
    document.getElementById("product-error").textContent =
      "Our collection will appear here once the store connection is added.";
    return;
  }

  const { data, error } = await supabaseClient
    .from("products")
    .select("id, name, description, price_inr, image_url")
    .eq("in_stock", true)
    .order("display_order", { ascending: true });

  if (error) {
    document.getElementById("product-error").textContent =
      "Database error: " + error.message;
    return;
  }

  const prices = {
    "Just in Case Box": 130,
    "Little Lift Box": 150,
    "Cozy Craving Box": 310,
    "Sweet Cravings Box": 240,
    "Scrunchie": 25,
    "Chocolate Add-on": 50,
    "Cute Charm": 40,
    "Handwritten Letter": 10,
    "Pendant": 20
  };

 const boxNames = [
  "Just in Case Box",
  "Little Lift Box",
  "Sweet Cravings Box",
  "Cozy Craving Box"
];

const boxOrder = {
  "Just in Case Box": 1,
  "Little Lift Box": 2,
  "Sweet Cravings Box": 3,
  "Cozy Craving Box": 4
};

  products = (data || [])
  .filter(product => boxNames.includes(product.name))
  .map(product => ({
    ...product,
    price_inr: prices[product.name]
  }))
  .sort((a, b) => boxOrder[a.name] - boxOrder[b.name]);

  container.innerHTML = "";

  products.forEach(product => {
    const card = document.createElement("article");
    card.className = "product";

    const emoji = document.createElement("div");
    emoji.className = "emoji";
    emoji.textContent = "🎀";

    if (product.image_url) {
      const img = document.createElement("img");
      img.src = product.image_url;
      img.alt = product.name;
      img.style.cssText =
        "width:100%;height:150px;object-fit:cover;border-radius:12px";
      img.onerror = () => img.remove();
      card.appendChild(img);
    } else {
      card.appendChild(emoji);
    }

    const name = document.createElement("h3");
    name.textContent = product.name;

    const description = document.createElement("p");
    description.textContent = product.description || "";

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = "₹" + product.price_inr;

    const add = document.createElement("button");
add.className = "btn";
add.textContent = "Add to Cart ♡";
add.addEventListener("click", () => {
  addToCart(product.id);
  refreshBoxQuantity();
  quantityControl.style.display = "flex";
});

const customize = document.createElement("button");
customize.className = "btn secondary";
customize.textContent = "Add On ♡";
customize.addEventListener("click", () => openCustomization(product.id));

    const quantityControl = document.createElement("div");
quantityControl.className = "quantity-control";
quantityControl.style.display = "none";
quantityControl.style.marginTop = "10px";
quantityControl.style.alignItems = "center";
quantityControl.style.justifyContent = "center";
quantityControl.style.gap = "12px";

const minus = document.createElement("button");
minus.textContent = "−";
minus.className = "btn secondary";

const quantity = document.createElement("span");
quantity.textContent = "0";

const plus = document.createElement("button");
plus.textContent = "+";
plus.className = "btn secondary";

quantityControl.append(minus, quantity, plus);
    function refreshBoxQuantity() {
  const cartItem = cart.find(item => item.id === product.id);
  const count = cartItem ? cartItem.quantity : 0;

  quantity.textContent = count;
  quantityControl.style.display = count > 0 ? "flex" : "none";
}

minus.addEventListener("click", () => {
  const cartItem = cart.find(item => item.id === product.id);
  if (!cartItem) return;

  if (cartItem.quantity > 1) {
    cartItem.quantity -= 1;
  } else {
    cart = cart.filter(item => item.id !== product.id);
  }

  updateCart();
  refreshBoxQuantity();
});

plus.addEventListener("click", () => {
  addToCart(product.id);
  refreshBoxQuantity();
});

card.append(name, description, price, add, customize, quantityControl);
    refreshBoxQuantity();
    container.appendChild(card);
  });
}
    let selectedBox = null;

  const customizationExtras = [
    { name: "Scrunchie", price: 25 },
    { name: "Chocolate Add-on", price: 50 },
    { name: "Cute Charm", price: 40 },
    { name: "Handwritten Letter", price: 10 },
    { name: "Pendant", price: 20 }
  ];

  function openCustomization(id) {
    selectedBox = products.find(item => item.id === id);
    if (!selectedBox) return;

    const options = document.getElementById("customization-options");
    options.innerHTML = "";

    customizationExtras.forEach((extra, index) => {
      const label = document.createElement("label");
      label.className = "extra-option";
label.style.cssText =
  "display:flex;align-items:center;gap:12px;padding:12px 14px;margin:8px 0;background:#fff;border:1px solid #f0d8e2;border-radius:12px;cursor:pointer;font-size:16px;text-align:left;";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "extra-checkbox";
checkbox.style.cssText =
  "width:18px;height:18px;flex-shrink:0;accent-color:#b56b91;cursor:pointer;margin:0;";
      checkbox.value = index;
      checkbox.addEventListener("change", updateCustomizationTotal);

      label.append(
        checkbox,
        document.createTextNode(` ${extra.name} (+₹${extra.price})`)
      );

      options.appendChild(label);
    });

    document.getElementById("custom-note").value = "";
    document.getElementById("customization-total").textContent =
      "Extras total: ₹0";
    const modal = document.getElementById("customization-modal");
modal.style.cssText = "display:flex; position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; padding:20px; box-sizing:border-box;";
  }

  function closeCustomization() {
    document.getElementById("customization-modal").style.display = "none";
    selectedBox = null;
  }
  function openCustomization(id) {
  selectedBox = products.find(item => item.id === id);
  if (!selectedBox) return;

  const options = document.getElementById("customization-options");
  options.innerHTML = "";

  customizationExtras.forEach((extra, index) => {
    const label = document.createElement("label");
    label.className = "extra-option";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "extra-checkbox";
    checkbox.value = index;
    checkbox.addEventListener("change", updateCustomizationTotal);

    label.append(
      checkbox,
      document.createTextNode(` ${extra.name} (+₹${extra.price})`)
    );

    options.appendChild(label);
  });

  document.getElementById("custom-note").value = "";
  document.getElementById("customization-total").textContent =
    "Extras total: ₹0";

  const modal = document.getElementById("customization-modal");
  modal.style.cssText =
    "display:flex; position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; padding:20px; box-sizing:border-box;";
}

  function updateCustomizationTotal() {
    const checked = document.querySelectorAll(
      "#customization-options input:checked"
    );

    const extrasTotal = Array.from(checked).reduce((sum, checkbox) => {
      return sum + customizationExtras[Number(checkbox.value)].price;
    }, 0);

    document.getElementById("customization-total").textContent =
      "Extras total: ₹" + extrasTotal;
  }

  function addCustomizedBox() {
    if (!selectedBox) return;

    const checked = document.querySelectorAll(
      "#customization-options input:checked"
    );

    const extras = Array.from(checked).map(checkbox => {
      return customizationExtras[Number(checkbox.value)];
    });

    const extrasTotal = extras.reduce((sum, extra) => sum + extra.price, 0);

    const note = document.getElementById("custom-note").value.trim();

    const customizedItem = {
      ...selectedBox,
      id: selectedBox.id + "-custom-" + Date.now(),
      name: selectedBox.name + (extras.length ? " + Extras" : ""),
      price_inr: selectedBox.price_inr + extrasTotal,
      quantity: 1,
      extras: extras,
      personal_note: note
    };

    cart.push(customizedItem);
    updateCart();
    closeCustomization();
  }

  function addToCart(id) {
    const product = products.find(item => item.id === id);
    if (!product) return;
    const existing = cart.find(item => item.id === id);
    if (existing) existing.quantity += 1;
    else cart.push({ ...product, quantity: 1 });
    updateCart();
  }

 function updateCart() {
  localStorage.setItem("cosyCravingCart", JSON.stringify(cart));

  const count = cart.reduce(
    (sum, item) => sum + item.quantity, 0
  );

  const countElement = document.getElementById("cart-count");

  if (countElement) {
    countElement.textContent = count;
  }
}
  document.addEventListener("DOMContentLoaded", updateCart);
  loadProducts();
  
</script>
  <div id="customization-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <button type="button" class="btn secondary" onclick="closeCustomization()">Close ✕</button>

    <h2>Customize Your Box ♡</h2>
    <p>Choose your little extras:</p>

    <div id="customization-options"></div>

    <label for="custom-note">Personal note (optional)</label>
    <textarea id="custom-note" rows="3"
      placeholder="Write a sweet little message..."></textarea>

    <p id="customization-total">Extras total: ₹0</p>

    <button type="button" class="btn" onclick="addCustomizedBox()">
      Add customized box ♡
    </button>
  </div>
</div>
</body>
</html>
